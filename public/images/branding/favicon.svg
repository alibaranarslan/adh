<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ADH">
  <title>ADH — Adıyaman Dijital Haber</title>
  <!-- Background -->
  <rect x="0" y="0" width="32" height="32" rx="3" ry="3" fill="#1A1A2E"/>
  <!-- ADH letters -->
  <text
    x="16" y="20"
    font-family="Georgia,'Times New Roman',serif"
    font-size="13.5"
    font-weight="700"
    letter-spacing="0.5"
    text-anchor="middle"
    fill="#FFFFFF"
  >ADH</text>
  <!-- Red underline -->
  <line x1="4" y1="25" x2="26" y2="25" stroke="#C62828" stroke-width="2"/>
  <!-- Red dot -->
  <rect x="26" y="23" width="4" height="4" fill="#C62828"/>
</svg>
